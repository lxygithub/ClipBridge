[workspace]
members = ["core", "windows", "android/jni"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
iroh = "=1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
